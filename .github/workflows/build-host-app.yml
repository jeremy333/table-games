# Every time the site changes: rebuilds the game list from the files in games/,
# then builds the Table Games Host Android app and posts it under
# Releases → "Table Games Host app".
name: Build host app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: host-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Adding a game is just uploading its file to games/: this rebuilds the
      # game list (games/catalog.js) from the game files and saves it.
      - name: Update the game list
        run: |
          node .github/build-catalog.mjs
          if ! git diff --quiet -- games/catalog.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add games/catalog.js
            git commit -m "Update the game list"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy the web app into the host app
        run: |
          WWW=android/app/src/main/assets/www
          mkdir -p "$WWW"
          cp index.html sw.js manifest.webmanifest icon.svg icon-180.png icon-192.png icon-512.png icon-maskable-512.png "$WWW"/
          cp -r css js games vendor "$WWW"/

      - name: Build the app
        working-directory: android
        run: gradle assembleRelease --no-daemon -PrepoSlug=${{ github.repository }}

      - name: Name the files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TableGamesHost.apk
          cp android/native-version.txt native-version.txt

      - name: Publish under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: host-app
          name: Table Games Host app
          body: |
            The Android app for hosting games on your phone's hotspot, with or without internet.
            On your Android phone, tap TableGamesHost.apk below to download and install it.
            Updated automatically each time the site changes.
          files: |
            TableGamesHost.apk
            native-version.txt
          make_latest: true
