<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Table Games</title>
  <meta name="description" content="Card games across everyone's phones, no internet needed.">
  <meta name="theme-color" content="#1d4a37">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Table Games">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <noscript>Table Games needs JavaScript turned on.</noscript>
  </main>
  <script>
    // If the app hasn't started after a few seconds (for example, a phone kept
    // part of an old version), offer a one-tap repair instead of a blank screen.
    setTimeout(function () {
      if (window.__tgStarted) return;
      var main = document.getElementById('app');
      main.innerHTML = '<h2 style="font-family:Georgia,serif">Table Games didn\u2019t start</h2>' +
        '<p>Your phone may still have part of an older version. Repair clears the saved app (downloaded games are kept) and reloads it. You need internet for this.</p>' +
        '<button id="tg-repair" class="primary big">Repair and reload</button>';
      document.getElementById('tg-repair').onclick = async function () {
        this.disabled = true; this.textContent = 'Repairing\u2026';
        try {
          if (navigator.serviceWorker) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.filter(function (k) { return k !== 'tg-games'; }).map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        location.reload();
      };
    }, 6000);
  </script>
  <script src="vendor/jsQR.js"></script>
  <script src="vendor/peerjs.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
